name: Deploy to Linode

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('booking-check-{0}', github.event.pull_request.number) || 'production-deploy' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate booking endpoint
        run: |
          php -l contact.php
          php tests/contact.test.php

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: 45.79.181.88
      DEPLOY_PORT: 22
      DEPLOY_USER: root
      DEPLOY_PATH: /var/www/pinecreekradio.com/

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Ensure remote directory exists
        run: |
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH'"

      - name: Check booking endpoint before replacing public contact information
        run: |
          rsync -avz \
            -e "ssh -p $DEPLOY_PORT -i ~/.ssh/deploy_key" \
            contact.php "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"
          curl --fail --silent --show-error --max-time 20 \
            "https://pinecreekradio.com/contact.php?deploy=$GITHUB_SHA" \
            | php -r '$data = json_decode(stream_get_contents(STDIN), true); exit(($data["ok"] ?? false) === true ? 0 : 1);'

      - name: Deploy site files
        run: |
          rsync -avz --delete \
            --exclude='/tests/' \
            --exclude='/songs/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.DS_Store' \
            --exclude='.gitignore' \
            --exclude='CNAME' \
            --exclude='README.md' \
            -e "ssh -p $DEPLOY_PORT -i ~/.ssh/deploy_key" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"
